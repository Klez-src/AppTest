<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>undercal</title>

    <link
        rel="stylesheet"
        href="style.css?v=1"
    >

</head>


<body>

<div id="app">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">


        <div class="brand">

            <div class="brand-mark">

                <span></span>

            </div>


            <span class="brand-name">
                undercal
            </span>

        </div>


        <div
            class="window-controls"
            data-no-drag
        >

            <button
                id="minimizeButton"
                class="window-button minimize"
                aria-label="Minimize"
            >
                <span></span>
            </button>


            <button
                id="closeButton"
                class="window-button close"
                aria-label="Close"
            >
                ×
            </button>

        </div>

    </header>



    <!-- =====================================================
         CONTENT
         ===================================================== -->

    <main class="content">


        <!-- =================================================
             GAME FILTERS
             ================================================= -->

        <nav
            class="game-tabs"
            data-no-drag
        >


            <button
                class="game-tab all-tab"
                data-game="all"
            >

                <span class="tab-icon lightning">
                    ◆
                </span>

                <span>
                    All games
                </span>

            </button>


            <button
                class="game-tab active"
                data-game="csgo"
            >

                <span class="tab-icon">
                    ϟ
                </span>

                <span>
                    CS:GO
                </span>

            </button>


            <button
                class="game-tab"
                data-game="cs2"
            >

                <span class="tab-icon cs2-icon">
                    2
                </span>

                <span>
                    CS:2
                </span>

            </button>


        </nav>



        <!-- =================================================
             GAME LIST
             ================================================= -->

        <section
            class="games"
            id="games"
        >


            <!-- CS:GO -->

            <article
                class="game-card"
                data-games="csgo"
            >


                <div class="game-icon primordial-icon">

                    <span>
                        ◇
                    </span>

                </div>


                <div class="game-info">

                    <div class="game-name">
                        Primordial
                    </div>

                </div>


                <div class="game-actions">

                    <span class="subscription">
                        Not subscribed
                    </span>


                    <span class="game-version">
                        CS:GO
                    </span>

                </div>


            </article>



            <article
                class="game-card"
                data-games="csgo"
            >


                <div class="game-icon gamesense-icon">

                    <span>
                        GS
                    </span>

                </div>


                <div class="game-info">

                    <div class="game-name">
                        Gamesense
                    </div>

                </div>


                <div class="game-actions">

                    <span class="subscription">
                        Not subscribed
                    </span>


                    <span class="game-version">
                        CS:GO
                    </span>

                </div>


            </article>



            <!-- CS2 -->

            <article
                class="game-card hidden-game"
                data-games="cs2"
            >


                <div class="game-icon cs2-game-icon">

                    <span>
                        2
                    </span>

                </div>


                <div class="game-info">

                    <div class="game-name">
                        Primordial
                    </div>

                </div>


                <div class="game-actions">

                    <span class="subscription">
                        Not subscribed
                    </span>


                    <span class="game-version">
                        CS:2
                    </span>

                </div>


            </article>


        </section>



        <!-- =================================================
             INJECT
             ================================================= -->

        <button
            class="inject-button"
            id="injectButton"
            data-no-drag
        >

            <span class="inject-mark">

                <span></span>

            </span>


            <span>
                Inject
            </span>

        </button>


    </main>



    <!-- =====================================================
         LAUNCH / QUEUE SCREEN
         ===================================================== -->

    <div
        id="queueScreen"
        class="queue-screen"
    >


        <div class="queue-content">


            <div class="queue-brand">

                <div class="queue-brand-mark">

                    <span></span>

                </div>

                <span>
                    undercal
                </span>

            </div>


            <div class="queue-title">
                You're in the queue.
            </div>


            <div class="queue-subtitle">
                Waiting for your session.
            </div>


            <div class="queue-number">

                <span id="queueCount">
                    2
                </span>

                <small>
                    people ahead
                </small>

            </div>


            <div class="queue-progress">

                <div
                    id="queueProgress"
                    class="queue-progress-fill"
                ></div>

            </div>


            <div class="queue-bottom">

                <span id="queueTime">
                    ~29 seconds
                </span>

                <span>
                    position
                    <b id="queuePosition">
                        3
                    </b>
                </span>

            </div>


            <button
                id="cancelQueue"
                class="cancel-button"
            >
                Cancel
            </button>


        </div>


    </div>


</div>


<script src="script.js?v=1"></script>

</body>

</html>
