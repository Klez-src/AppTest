<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=315, height=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Loader</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app">

    <!-- =====================================================
         NATIVE-STYLE TOP BAR
         ===================================================== -->

    <header class="topbar drag-region">

        <div class="window-controls no-drag">

            <button
                id="minimizeButton"
                class="window-button"
                aria-label="Minimize"
            >
                <span class="minimize-icon"></span>
            </button>

            <button
                id="closeButton"
                class="window-button close-button"
                aria-label="Close"
            >
                <span class="close-icon"></span>
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN LOADER
         ===================================================== -->

    <main class="loader">

        <!-- GAME FILTERS -->

        <section class="game-filter-shell">

            <div class="game-filters">

                <button
                    class="game-filter active"
                    data-game="all"
                >
                    <span class="filter-icon lightning-icon"> </span>
                    <span>All games</span>
                </button>


                <button
                    class="game-filter"
                    data-game="csgo"
                >
                    <span class="filter-icon csgo-icon"></span>
                    <span>CS:GO</span>
                </button>


                <button
                    class="game-filter"
                    data-game="cs2"
                >
                    <span class="filter-icon cs2-icon"></span>
                    <span>CS:2</span>
                </button>

            </div>

        </section>


        <!-- =================================================
             PRODUCT AREA
             ================================================= -->

        <section class="products-shell">

            <div
                id="products"
                class="products"
            ></div>

        </section>


        <!-- =================================================
             INJECT
             ================================================= -->

        <button
            id="injectButton"
            class="inject-button"
        >

            <span class="inject-icon">
                <span></span>
            </span>

            <span>Inject</span>

        </button>

    </main>


    <!-- =====================================================
         LAUNCH SCREEN
         ===================================================== -->

    <div
        id="launchScreen"
        class="launch-screen"
    >

        <div class="launch-content">

            <div
                id="launchTitle"
                class="launch-title"
            >
                Injecting
            </div>

            <div
                id="launchOption"
                class="launch-option"
            >
                Primordial CS:GO
            </div>

            <div class="launch-progress-track">

                <div
                    id="launchProgress"
                    class="launch-progress"
                ></div>

            </div>

            <button
                id="cancelLaunch"
                class="cancel-button"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<script src="./script.js"></script>

</body>
</html>
