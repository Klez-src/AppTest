<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title></title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css?v=3"
    >

</head>


<body>

<div id="app">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header
        class="topbar"
        data-drag
    >

        <div class="topbar-spacer"></div>


        <div
            class="window-controls"
            data-no-drag
        >

            <button
                id="minimizeButton"
                class="window-button minimize"
                aria-label="Minimize"
            >
                <span></span>
            </button>


            <button
                id="closeButton"
                class="window-button close"
                aria-label="Close"
            >
                ×
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="content">


        <!-- =================================================
             GAME FILTER
             ================================================= -->

        <nav
            class="game-tabs"
            data-no-drag
        >

            <button
                class="game-tab"
                data-game="all"
            >
                <span class="tab-symbol">●</span>
                <span>All games</span>
            </button>


            <button
                class="game-tab active"
                data-game="csgo"
            >
                <span class="tab-symbol">ʃ</span>
                <span>CS:GO</span>
            </button>


            <button
                class="game-tab"
                data-game="cs2"
            >
                <span class="tab-symbol cs2-symbol">2</span>
                <span>CS:2</span>
            </button>

        </nav>



        <!-- =================================================
             GAMES
             ================================================= -->

        <section
            id="games"
            class="games"
        >


            <!-- =============================================
                 PRIMORDIAL
                 ============================================= -->

            <article
                class="game-card"
                data-games="csgo"
            >

                <div class="game-card-inner">

                    <div class="game-info">

                        <div class="game-name">
                            Primordial
                        </div>

                    </div>


                    <div class="game-actions">

                        <div class="subscription">
                            Not subscribed
                        </div>

                        <div class="game-version">
                            CS:GO
                        </div>

                    </div>

                </div>

            </article>



            <!-- =============================================
                 GAMESENSE
                 ============================================= -->

            <article
                class="game-card"
                data-games="csgo"
            >

                <div class="game-card-inner">

                    <div class="game-info">

                        <div class="game-name">
                            Gamesense
                        </div>

                    </div>


                    <div class="game-actions">

                        <div class="subscription">
                            Not subscribed
                        </div>

                        <div class="game-version">
                            CS:GO
                        </div>

                    </div>

                </div>

            </article>



            <!-- =============================================
                 CS2 PLACEHOLDER
                 ============================================= -->

            <article
                class="game-card hidden-game"
                data-games="cs2"
            >

                <div class="game-card-inner">

                    <div class="game-info">

                        <div class="game-name">
                            Primordial
                        </div>

                    </div>


                    <div class="game-actions">

                        <div class="subscription">
                            Not subscribed
                        </div>

                        <div class="game-version">
                            CS:2
                        </div>

                    </div>

                </div>

            </article>


        </section>



        <!-- =================================================
             BOTTOM ACTION
             ================================================= -->

        <button
            id="injectButton"
            class="inject-button"
            data-no-drag
        >
            <span class="inject-mark"></span>
            <span>Inject</span>
        </button>


    </main>



    <!-- =====================================================
         QUEUE / LAUNCH SCREEN
         ===================================================== -->

    <div
        id="queueScreen"
        class="queue-screen"
    >

        <div class="queue-content">

            <div class="queue-title">
                You're in the queue.
            </div>


            <div class="queue-subtitle">
                Waiting for your session.
            </div>


            <div class="queue-number">

                <span id="queueCount">
                    2
                </span>

                <small>
                    people ahead
                </small>

            </div>


            <div class="queue-progress">

                <div
                    id="queueProgress"
                    class="queue-progress-fill"
                ></div>

            </div>


            <div class="queue-bottom">

                <span id="queueTime">
                    ~29 seconds
                </span>

                <span>
                    position
                    <b id="queuePosition">
                        3
                    </b>
                </span>

            </div>


            <button
                id="cancelQueue"
                class="cancel-button"
            >
                Cancel
            </button>

        </div>

    </div>


</div>


<script src="script.js?v=3"></script>

</body>

</html>
