<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>undercal</title>

    <link
        rel="stylesheet"
        href="style.css?v=2"
    >

</head>


<body>

<div id="app">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">

        <div class="brand">

            <span class="brand-name">
                undercal
            </span>

        </div>


        <div
            class="window-controls"
            data-no-drag
        >

            <button
                id="minimizeButton"
                class="window-button minimize"
                aria-label="Minimize"
            >
                <span></span>
            </button>


            <button
                id="closeButton"
                class="window-button close"
                aria-label="Close"
            >
                ×
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="content">


        <!-- =================================================
             GAME TABS
             ================================================= -->

        <nav
            class="game-tabs"
            data-no-drag
        >

            <button
                class="game-tab all-tab"
                data-game="all"
            >
                All games
            </button>


            <button
                class="game-tab active"
                data-game="csgo"
            >
                CS:GO
            </button>


            <button
                class="game-tab"
                data-game="cs2"
            >
                CS:2
            </button>

        </nav>



        <!-- =================================================
             GAME CARDS
             ================================================= -->

        <section
            class="games"
            id="games"
        >


            <article
                class="game-card"
                data-games="csgo"
            >

                <div class="game-info">

                    <div class="game-name">
                        Primordial
                    </div>

                </div>


                <div class="game-actions">

                    <span class="subscription">
                        Not subscribed
                    </span>

                    <span class="game-version">
                        CS:GO
                    </span>

                </div>

            </article>



            <article
                class="game-card"
                data-games="csgo"
            >

                <div class="game-info">

                    <div class="game-name">
                        Gamesense
                    </div>

                </div>


                <div class="game-actions">

                    <span class="subscription">
                        Not subscribed
                    </span>

                    <span class="game-version">
                        CS:GO
                    </span>

                </div>

            </article>



            <article
                class="game-card hidden-game"
                data-games="cs2"
            >

                <div class="game-info">

                    <div class="game-name">
                        Primordial
                    </div>

                </div>


                <div class="game-actions">

                    <span class="subscription">
                        Not subscribed
                    </span>

                    <span class="game-version">
                        CS:2
                    </span>

                </div>

            </article>


        </section>



        <!-- =================================================
             INJECT
             ================================================= -->

        <button
            class="inject-button"
            id="injectButton"
            data-no-drag
        >
            Inject
        </button>


    </main>



    <!-- =====================================================
         QUEUE SCREEN
         ===================================================== -->

    <div
        id="queueScreen"
        class="queue-screen"
    >

        <div class="queue-content">


            <div class="queue-brand">
                undercal
            </div>


            <div class="queue-title">
                You're in the queue.
            </div>


            <div class="queue-subtitle">
                Waiting for your session.
            </div>


            <div class="queue-number">

                <span id="queueCount">
                    2
                </span>

                <small>
                    people ahead
                </small>

            </div>


            <div class="queue-progress">

                <div
                    id="queueProgress"
                    class="queue-progress-fill"
                ></div>

            </div>


            <div class="queue-bottom">

                <span id="queueTime">
                    ~29 seconds
                </span>

                <span>
                    position
                    <b id="queuePosition">
                        3
                    </b>
                </span>

            </div>


            <button
                id="cancelQueue"
                class="cancel-button"
            >
                Cancel
            </button>


        </div>

    </div>


</div>


<script src="script.js?v=2"></script>

</body>

</html>
