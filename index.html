<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Application</title>

    <link
        rel="stylesheet"
        href="./style.css?v=20260823"
    >
</head>

<body>

    <div id="app">

        <!-- ================================================
             TOP BAR
             ================================================ -->

        <header
            id="titlebar"
            class="titlebar"
        >

            <div class="window-controls">

                <button
                    id="minimizeButton"
                    class="window-button"
                    type="button"
                    aria-label="Minimise"
                >
                    <span class="minimize-icon"></span>
                </button>

                <button
                    id="closeButton"
                    class="window-button close-button"
                    type="button"
                    aria-label="Close"
                >
                    <span class="close-icon"></span>
                </button>

            </div>

        </header>


        <!-- ================================================
             MAIN UI
             ================================================ -->

        <main id="main-ui">

            <!-- GAME SELECTOR -->

            <div class="game-selector-shell">

                <button
                    class="game-tab active"
                    data-game="all"
                    type="button"
                >
                    <span class="game-icon lightning-icon"></span>
                    <span>All games</span>
                </button>


                <button
                    class="game-tab"
                    data-game="csgo"
                    type="button"
                >
                    <span class="game-icon csgo-icon"></span>
                    <span>CS:GO</span>
                </button>


                <button
                    class="game-tab"
                    data-game="cs2"
                    type="button"
                >
                    <span class="game-icon cs2-icon"></span>
                    <span>CS:2</span>
                </button>

            </div>


            <!-- ============================================
                 OPTIONS AREA
                 ============================================ -->

            <section
                id="options-panel"
                class="options-panel"
            >

                <div
                    id="options-list"
                    class="options-list"
                ></div>

            </section>


            <!-- ============================================
                 INJECT
                 ============================================ -->

            <button
                id="injectButton"
                class="inject-button"
                type="button"
            >
                <span class="inject-arrow"></span>
                <span>Inject</span>
            </button>

        </main>


        <!-- ================================================
             LOADING SCREEN
             ================================================ -->

        <section
            id="loading-screen"
            class="loading-screen"
            aria-hidden="true"
        >

            <div class="loading-content">

                <div
                    id="loading-title"
                    class="loading-title"
                >
                    Injecting
                </div>


                <div
                    id="loading-option"
                    class="loading-option"
                >
                    Primordial — CS:GO
                </div>


                <div class="loading-track">

                    <div
                        id="loading-fill"
                        class="loading-fill"
                    ></div>

                </div>


                <button
                    id="cancelButton"
                    class="cancel-button"
                    type="button"
                >
                    Cancel
                </button>

            </div>

        </section>

    </div>


    <script
        src="./script.js?v=20260823"
    ></script>

</body>

</html>
