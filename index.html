<!-- ==================================================
     FULL-SCREEN QUEUE
     ================================================== -->

<section
    id="queue"
    class="queue-screen"
>

    <div class="queue-inner">

        <div class="queue-brand">
            orro
        </div>


        <h1>
            You're in the queue.
        </h1>


        <div class="queue-ahead">

            <span id="queue-ahead-number">
                3
            </span>

            <span>
                people ahead of you
            </span>

        </div>


        <div class="queue-progress-area">

            <div class="queue-progress">

                <div
                    id="queue-progress-fill"
                    class="queue-progress-fill"
                ></div>

            </div>

        </div>


        <div class="queue-details">

            <div class="queue-detail">

                <span>
                    Estimated wait
                </span>

                <strong id="queue-time">
                    ~29 seconds
                </strong>

            </div>


            <div class="queue-detail">

                <span>
                    Queue position
                </span>

                <strong id="queue-position">
                    4
                </strong>

            </div>

        </div>


        <button
            class="queue-cancel"
            onclick="cancelLaunch()"
        >
            Cancel
        </button>

    </div>

</section>
