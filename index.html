<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Loader</title>

    <link
        rel="stylesheet"
        href="./style.css?v=20260823"
    >
</head>

<body>

<div id="app">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <div class="topbar">

        <div
            class="topbar-drag-area"
            data-drag
        ></div>

        <div class="window-controls">

            <button
                id="minimizeButton"
                class="window-button minimize"
                aria-label="Minimize"
                data-no-drag
            >
                <span></span>
            </button>

            <button
                id="closeButton"
                class="window-button close"
                aria-label="Close"
                data-no-drag
            >
                ×
            </button>

        </div>

    </div>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="content">

        <!-- =================================================
             GAME SELECTOR
             ================================================= -->

        <div class="game-tabs-shell">

            <div class="game-tabs">

                <!-- ALL GAMES -->

                <button
                    class="game-tab"
                    data-game="all"
                >
                    <span
                        class="tab-icon lightning-icon"
                        aria-hidden="true"
                    ></span>

                    <span class="tab-label">
                        All games
                    </span>
                </button>


                <!-- CS:GO -->

                <button
                    class="game-tab active"
                    data-game="csgo"
                >
                    <span
                        class="tab-icon csgo-icon"
                        aria-hidden="true"
                    ></span>

                    <span class="tab-label">
                        CS:GO
                    </span>
                </button>


                <!-- CS2 -->

                <button
                    class="game-tab"
                    data-game="cs2"
                >
                    <span
                        class="tab-icon cs2-icon"
                        aria-hidden="true"
                    ></span>

                    <span class="tab-label">
                        CS:2
                    </span>
                </button>

            </div>

        </div>


        <!-- =================================================
             GAMES PANEL
             ================================================= -->

        <section class="games-panel">

            <div class="games">

                <!-- =========================================
                     PRIMORDIAL — CS:GO
                     ========================================= -->

                <div
                    class="game-card"
                    data-games="csgo"
                    data-option="Primordial"
                    data-game-label="CS:GO"
                    tabindex="0"
                >

                    <div class="game-card-inner">

                        <div class="game-info">

                            <div class="game-logo">
                                <img
                                    src="primordial.png"
                                    alt="Primordial"
                                    draggable="false"
                                >
                            </div>

                            <div class="game-name">
                                Primordial
                            </div>

                        </div>


                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:GO
                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================================
                     GAMESENSE — CS:GO
                     ========================================= -->

                <div
                    class="game-card"
                    data-games="csgo"
                    data-option="Gamesense"
                    data-game-label="CS:GO"
                    tabindex="0"
                >

                    <div class="game-card-inner">

                        <div class="game-info">

                            <div class="game-logo">
                                <img
                                    src="gamesense.png"
                                    alt="Gamesense"
                                    draggable="false"
                                >
                            </div>

                            <div class="game-name">
                                Gamesense
                            </div>

                        </div>


                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:GO
                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================================
                     PRIMORDIAL — CS2
                     ========================================= -->

                <div
                    class="game-card"
                    data-games="cs2"
                    data-option="Primordial"
                    data-game-label="CS2"
                    tabindex="0"
                >

                    <div class="game-card-inner">

                        <div class="game-info">

                            <div class="game-logo">
                                <img
                                    src="primordial.png"
                                    alt="Primordial"
                                    draggable="false"
                                >
                            </div>

                            <div class="game-name">
                                Primordial
                            </div>

                        </div>


                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS2
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             INJECT
             ================================================= -->

        <button
            id="injectButton"
            class="inject-button"
        >

            <span
                class="inject-mark"
                aria-hidden="true"
            ></span>

            <span>
                Inject
            </span>

        </button>

    </main>


    <!-- =====================================================
         INJECTION SCREEN
         ===================================================== -->

    <div
        id="injectionScreen"
        class="injection-screen"
        aria-hidden="true"
    >

        <div class="injection-content">

            <div
                id="injectionTitle"
                class="injection-title"
            >
                Injecting Primordial
            </div>


            <div class="injection-progress">

                <div
                    id="injectionProgress"
                    class="injection-progress-fill"
                ></div>

            </div>


            <button
                id="cancelInjection"
                class="cancel-button"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<script
    src="./script.js?v=20260823"
></script>

</body>
</html>
