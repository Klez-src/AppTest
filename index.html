<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>orro</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="app">

    <!-- =====================================================
         CUSTOM TOP BAR
         ===================================================== -->

    <div class="topbar">

        <div
            class="topbar-drag-area"
            data-drag
        ></div>

        <div class="window-controls">

            <button
                id="minimizeButton"
                class="window-button minimize"
                aria-label="Minimize"
                data-no-drag
            >
                <span></span>
            </button>

            <button
                id="closeButton"
                class="window-button close"
                aria-label="Close"
                data-no-drag
            >
                ×
            </button>

        </div>

    </div>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="content">


        <!-- =================================================
             GAME SELECTOR
             ================================================= -->

        <div class="game-tabs-shell">

            <div class="game-tabs">

                <button
                    class="game-tab"
                    data-game="all"
                >

                    <span class="tab-icon all-icon">
                        +
                    </span>

                    <span class="tab-label">
                        All games
                    </span>

                </button>


                <button
                    class="game-tab active"
                    data-game="csgo"
                >

                    <span class="tab-icon csgo-icon">
                        ʃ
                    </span>

                    <span class="tab-label">
                        CS:GO
                    </span>

                </button>


                <button
                    class="game-tab"
                    data-game="cs2"
                >

                    <span class="tab-icon cs2-icon">
                        2
                    </span>

                    <span class="tab-label">
                        CS:2
                    </span>

                </button>

            </div>

        </div>


        <!-- =================================================
             GAMES PANEL
             ================================================= -->

        <section class="games-panel">

            <div class="games">


                <!-- =========================================
                     PRIMORDIAL
                     ========================================= -->

                <div
                    class="game-card"
                    data-games="csgo"
                    tabindex="0"
                >

                    <div class="game-card-inner">

                        <div class="game-info">

                            <div class="game-logo">

                                <img
                                    src="primordial.png"
                                    alt="Primordial"
                                    draggable="false"
                                >

                            </div>


                            <div class="game-name">
                                Primordial
                            </div>

                        </div>


                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:GO
                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================================
                     GAMESENSE
                     ========================================= -->

                <div
                    class="game-card"
                    data-games="csgo"
                    tabindex="0"
                >

                    <div class="game-card-inner">

                        <div class="game-info">

                            <div class="game-logo">

                                <img
                                    src="gamesense.png"
                                    alt="Gamesense"
                                    draggable="false"
                                >

                            </div>


                            <div class="game-name">
                                Gamesense
                            </div>

                        </div>


                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:GO
                            </div>

                        </div>

                    </div>

                </div>


            </div>

        </section>


        <!-- =================================================
             INJECT
             ================================================= -->

        <button
            id="injectButton"
            class="inject-button"
        >

            <span class="inject-mark"></span>

            <span>
                Inject
            </span>

        </button>

    </main>


    <!-- =====================================================
         QUEUE / LOADING SCREEN
         ===================================================== -->

    <div
        id="queueScreen"
        class="queue-screen"
    >

        <div class="queue-content">

            <div class="queue-title">
                orro
            </div>


            <div class="queue-subtitle">
                You're in the queue
            </div>


            <div class="queue-number">

                <span id="queueCount">
                    2
                </span>

                <span class="queue-people">
                    people ahead
                </span>

            </div>


            <div class="queue-progress">

                <div
                    id="queueProgress"
                    class="queue-progress-fill"
                ></div>

            </div>


            <div class="queue-bottom">

                <span>
                    Position
                    <b id="queuePosition">3</b>
                </span>

                <span id="queueTime">
                    ~29 seconds
                </span>

            </div>


            <button
                id="cancelQueue"
                class="cancel-button"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
