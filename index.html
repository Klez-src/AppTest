<section id="launching-page" class="launching-page">

    <div class="launching-inner">

        <div class="launching-eyebrow">
            ORRO
        </div>

        <div class="launching-title">
            Launching
        </div>

        <p class="launching-subtitle">
            Preparing your session.
        </p>

        <div class="launch-progress">
            <div
                class="launch-progress-fill"
                id="launchProgress"
            ></div>
        </div>

        <div class="launch-status">

            <span
                class="status-dot"
                id="launchStatusDot"
            ></span>

            <span id="launchStatus">
                Initialising
            </span>

        </div>

        <button
            class="cancel-launch"
            id="cancelLaunch"
        >
            Cancel
        </button>

    </div>

</section>
