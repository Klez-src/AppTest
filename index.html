<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title></title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css?v=5"
    >

</head>


<body>

<div id="app">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header
        class="topbar"
        data-drag
    >

        <!-- Empty draggable area.
             There is intentionally NO logo or name here. -->

        <div class="topbar-drag-area"></div>


        <div
            class="window-controls"
            data-no-drag
        >

            <button
                id="minimizeButton"
                class="window-button minimize"
                aria-label="Minimize"
            >

                <span></span>

            </button>


            <button
                id="closeButton"
                class="window-button close"
                aria-label="Close"
            >
                ×
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="content">


        <!-- =================================================
             TOP GAME SELECTOR SHELL
             ================================================= -->

        <nav
            class="game-tabs-shell"
            data-no-drag
        >

            <div class="game-tabs">


                <button
                    class="game-tab"
                    data-game="all"
                >

                    <span class="tab-icon all-icon">
                        ●
                    </span>

                    <span class="tab-label">
                        All games
                    </span>

                </button>



                <button
                    class="game-tab active"
                    data-game="csgo"
                >

                    <span class="tab-icon csgo-icon">
                        ʃ
                    </span>

                    <span class="tab-label">
                        CS:GO
                    </span>

                </button>



                <button
                    class="game-tab"
                    data-game="cs2"
                >

                    <span class="tab-icon cs2-icon">
                        2
                    </span>

                    <span class="tab-label">
                        CS:2
                    </span>

                </button>


            </div>

        </nav>



        <!-- =================================================
             MAIN GAME PANEL
             ================================================= -->

        <section
            id="gamesPanel"
            class="games-panel"
        >


            <div
                id="games"
                class="games"
            >


                <!-- =========================================
                     PRIMORDIAL
                     ========================================= -->

                <article
                    class="game-card"
                    data-games="csgo"
                >

                    <div class="game-card-inner">


                        <div class="game-info">

                            <div class="game-name">
                                Primordial
                            </div>

                        </div>



                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:GO
                            </div>

                        </div>


                    </div>

                </article>



                <!-- =========================================
                     GAMESENSE
                     ========================================= -->

                <article
                    class="game-card"
                    data-games="csgo"
                >

                    <div class="game-card-inner">


                        <div class="game-info">

                            <div class="game-name">
                                Gamesense
                            </div>

                        </div>



                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:GO
                            </div>

                        </div>


                    </div>

                </article>



                <!-- =========================================
                     CS2 PLACEHOLDER
                     ========================================= -->

                <article
                    class="game-card hidden-game"
                    data-games="cs2"
                >

                    <div class="game-card-inner">


                        <div class="game-info">

                            <div class="game-name">
                                Primordial
                            </div>

                        </div>



                        <div class="game-actions">

                            <div class="subscription">
                                Not subscribed
                            </div>

                            <div class="game-version">
                                CS:2
                            </div>

                        </div>


                    </div>

                </article>


            </div>


        </section>



        <!-- =================================================
             INJECT BUTTON
             ================================================= -->

        <button
            id="injectButton"
            class="inject-button"
            data-no-drag
        >

            <span class="inject-mark"></span>

            <span class="inject-label">
                Inject
            </span>

        </button>


    </main>



    <!-- =====================================================
         QUEUE / LAUNCH SCREEN
         ===================================================== -->

    <div
        id="queueScreen"
        class="queue-screen"
    >

        <div class="queue-content">


            <div class="queue-title">
                You're in the queue.
            </div>


            <div class="queue-subtitle">
                Waiting for your session.
            </div>


            <div class="queue-number">

                <span id="queueCount">
                    2
                </span>

                <span class="queue-people">
                    people ahead
                </span>

            </div>


            <div class="queue-progress">

                <div
                    id="queueProgress"
                    class="queue-progress-fill"
                ></div>

            </div>


            <div class="queue-bottom">

                <span id="queueTime">
                    ~29 seconds
                </span>


                <span>
                    position
                    <b id="queuePosition">
                        3
                    </b>
                </span>

            </div>


            <button
                id="cancelQueue"
                class="cancel-button"
            >
                Cancel
            </button>


        </div>

    </div>


</div>


<script src="script.js?v=5"></script>

</body>

</html>
